name: Claude Code

on:
  push:
    branches: [master]
    paths: &claude-code-paths
      - "skills/**"
      - "src/Providers/ClaudeCode/**"
      - "dist/**"
      - ".github/workflows/claude-code.yml"
  pull_request:
    paths: *claude-code-paths

jobs:
  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # The Claude Code CLI needs Node 22+; on Node 20, npm silently installs an old version whose
      # `plugin validate` can't check a skills folder. The rest of this job runs fine on 22 too.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Validate the skill
        run: claude plugin validate --strict skills
      - name: The bundled script the skill runs starts
        run: pnpm build:verify && node node_modules/.cache/harness-ledger/harness-ledger.mjs --help
