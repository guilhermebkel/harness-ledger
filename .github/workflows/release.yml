name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch, minor or major; none releases the current version as is (first release)"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, none]

concurrency:
  group: master-writes
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bump the version in package.json, plugin.json and the landing page
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" != "none" ]; then
            pnpm version "$BUMP" --no-git-tag-version
          fi
          node -e '
            const fs = require("node:fs");
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pluginPath = ".claude-plugin/plugin.json";
            const plugin = fs.readFileSync(pluginPath, "utf8");
            fs.writeFileSync(pluginPath, plugin.replace(/"version": "[^"]*"/, `"version": "${version}"`));
            const marketplacePath = ".claude-plugin/marketplace.json";
            const marketplace = fs.readFileSync(marketplacePath, "utf8");
            fs.writeFileSync(marketplacePath, marketplace.replace(/"ref": "[^"]*"/, `"ref": "v${version}"`));
            const sitePath = "site/index.html";
            const site = fs.readFileSync(sitePath, "utf8");
            const footerPattern = /Version [^,<]*, page updated <time datetime="[^"]*">[^<]*<\/time>/;
            if (!footerPattern.test(site)) throw new Error("site/index.html has no version footer to update");
            const now = new Date();
            const isoDate = now.toISOString().slice(0, 10);
            const longDate = now.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" });
            fs.writeFileSync(sitePath, site.replace(footerPattern, `Version ${version}, page updated <time datetime="${isoDate}">${longDate}</time>`));
            const sitemapPath = "site/sitemap.xml";
            const sitemap = fs.readFileSync(sitemapPath, "utf8");
            fs.writeFileSync(sitemapPath, sitemap.replace(/<lastmod>[^<]*<\/lastmod>/, `<lastmod>${isoDate}</lastmod>`));
          '
          VERSION=$(node -p 'require("./package.json").version')
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION is already released; pick patch, minor or major." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Rebuild dist/ from scratch, so a renamed bundle leaves no old file behind
        run: rm -rf dist && pnpm build
      - name: Check the package against the bundle it ships
        run: pnpm release:check
      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .claude-plugin/plugin.json .claude-plugin/marketplace.json site/ dist/
          if ! git diff --cached --quiet; then
            git commit -m "release: v$VERSION [skip ci]"
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:master "v$VERSION"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
      # Why: a push made with GITHUB_TOKEN doesn't start other workflows, so the release has to start Pages itself.
      - name: Publish the landing page with the new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
